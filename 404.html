<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Trust Diagnostic by Imaginal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1f3ef;--ink:#0c3333;--teal:#2f6f68;--teal-mid:#1faa93;--teal-d:#215952;--slate:#5c6461;--mute:#646966;--rule:#dde1dc;
--f-head:"IBM Plex Sans",sans-serif;--f-body:"IBM Plex Sans",sans-serif;--f-mono:"IBM Plex Mono",monospace;}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}a:hover{color:var(--teal-d)}
.wrap{max-width:1200px;margin:0 auto;padding:0 64px}
header.wrap{position:sticky;top:0;z-index:100;background:var(--paper);transition:background-color .25s ease,box-shadow .25s ease}
header.wrap.is-scrolled{background:rgba(248,249,247,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.logo-icon{animation:logoSpinIn .8s ease}
@keyframes logoSpinIn{from{transform:rotate(-180deg) scale(.4);opacity:0}to{transform:rotate(0deg) scale(1);opacity:1}}
h1,h2{font-family:var(--f-head);margin:0;letter-spacing:-0.01em}
.btn{display:inline-block;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:14px 26px;border-radius:3px;font-weight:500;white-space:nowrap;transition:opacity .15s}
.btn::before{content:"";display:inline-block;width:0;height:8px;opacity:0;margin-right:0;overflow:hidden;background:currentColor;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);transform:rotate(-90deg);vertical-align:middle;transition:width .2s ease,opacity .2s ease,margin-right .2s ease,transform .3s ease}
.btn:hover::before{width:8px;opacity:1;margin-right:8px;transform:rotate(0deg)}
.btn:active{transform:scale(.97)}
.btn:active::before{transform:translateX(4px) rotate(0deg)}
.btn:hover{background:var(--ink);color:#fff}
.btn-solid{background:var(--teal-mid);color:var(--ink)}.btn-solid:hover{background:var(--teal);color:#fff}
@media (max-width:900px){header.wrap{padding:14px 28px !important}header.wrap img{height:47px !important}}
</style>
</head>
<body>

<header class="wrap" style="display:flex;align-items:center;justify-content:space-between;padding:16px 64px;">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;">
    <img class="logo-icon" src="logo-icon.svg" alt="" style="height:61px;width:auto;">
    <img src="logo-text.svg" alt="Trust Diagnostic by Imaginal" style="height:61px;width:auto;">
  </a>
</header>

<section class="wrap" style="min-height:52vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;">
  <p class="mono" style="color:var(--teal);margin:0 0 16px;">404</p>
  <h1 style="font-size:36px;font-weight:600;margin-bottom:14px;">This page doesn't exist.</h1>
  <p style="font-size:16px;color:var(--slate);max-width:480px;margin:0 0 30px;">The page you're looking for may have moved or the link may be out of date.</p>
  <a class="btn btn-solid" href="index.html">Back to home</a>
</section>

<p class="mono" style="text-align:center;color:var(--mute);padding-bottom:30px;">© Imaginal Platform 2026. All rights reserved.</p>

<script>
(function(){
  var header = document.querySelector('header.wrap');
  function onScroll(){ header.classList.toggle('is-scrolled', window.scrollY > 4); }
  onScroll();
  window.addEventListener('scroll', onScroll, {passive:true});
})();
</script>
</body>
</html>
